# Sentrux architectural rules for mlx-dllm.
# `sentrux check .` enforces these; `sentrux gate .` compares vs .sentrux/baseline.json.
# Caps are tuned to this repo; see AGENTS.md "Architectural gate" for the measured numbers.

[constraints]
max_cycles = 0        # no circular dependencies
max_cc = 20           # tightened from the template's 25; repo max is denoise (cc=13)
max_fn_lines = 100    # template value; repo max is denoise (84 lines), no room to tighten
no_god_files = true   # flipped on; 0 god files today, so this locks the split in

# Layer ordering - a layer may depend only on layers of EQUAL OR HIGHER order
# (foundation layers carry the HIGHER number). This mirrors the real import graph:
# diffusion -> runtime -> families, and nothing points back down.
#
# The guard that matters: family adapters must not import mlx_dllm/mlx_dllm.runtime at
# module level (they are auto-imported while the package is still initializing, so a
# back-import raises a partially-initialized ImportError). See mlx_dllm/families/__init__.py.
# The package root sits in the "diffusion" layer so `from mlx_dllm import ...` is caught as
# well as `from mlx_dllm.runtime import ...`; it re-exports both modules, so leaving it
# unlayered would let the short spelling slip past the rule the long one trips.
#
# Known limits of this block:
# - It cannot also express "diffusion.py stays family-agnostic". runtime.py genuinely
#   imports families, which forces families to be the foundation, and any layer may
#   depend on the foundation.
# - Sentrux counts an import edge wherever it appears, nesting included, so the
#   function-body-deferred runtime import that families/__init__.py sanctions would
#   trip this rule too. No family defers one today; if one ever must, the layer block
#   is what to revisit - do not silently drop the family layer.
# - Only the paths below are guarded. A module in no layer is unguarded, so any future
#   top-level module (e.g. cli.py) has to be added to one. The families glob is `**`, not
#   `*`, because pkgutil.iter_modules auto-imports family SUBPACKAGES too and `*` matches
#   only the flat files - do not narrow it.

[[layers]]
name = "diffusion"
paths = ["mlx_dllm/diffusion.py", "mlx_dllm/__init__.py"]
order = 0

[[layers]]
name = "runtime"
paths = ["mlx_dllm/runtime.py"]
order = 1

[[layers]]
name = "families"
paths = ["mlx_dllm/families/**"]
order = 2
